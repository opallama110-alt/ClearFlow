name: Deploy

# Dijalankan manual dari tab Actions setelah secret FIREBASE_SERVICE_ACCOUNT_CLEARFLOWW dibuat
# (lihat README bagian "Deploy otomatis").
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy ke Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLEARFLOWW }}
          projectId: clearfloww
          channelId: live
